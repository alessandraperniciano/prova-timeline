<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mira: 1565/67</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Contenuto principale della pagina -->
    <main>
        <!-- Titolo e descrizione dell'evento storico -->
        <section class="hero">
            <h1>1565/67</h1>
            <p>
                Il frate Salvatore da Horta arriva a Cagliari
                e trascorre i suoi ultimi anni nel convento.
            </p>
        </section>

        <!-- Immagine principale dell'evento; l'altezza viene calcolata dal CSS -->
        <div class="image-container">
            <img src="img/1565_67.jpg" alt="Fotografia storica">
        </div>

        <!-- Elemento decorativo con motivo grafico -->
        <img id="pattern" width="100%" height="100%" src="img/pattern.png">

        <!-- Didascalia e fonte dell'immagine -->
        <section class="didas-section">
            <p>
                San Salvatore da Horta, 1520-1567
                <br>
                Fonte: Collezione Piloni, Cagliari nelle sue stampe
            </p>
        </section>
    </main>

    <!-- Piè di pagina con il logo del progetto -->
    <footer>

        <img id="logoFooter" width="20%" height="20%" src="img/LOGOMIRA.png">

    </footer>
</body>

</html>
