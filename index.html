<!DOCTYPE html>

<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">

        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: Roboto;
            width: 100%;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: black;
        }

        .orange1 {
            background-color: #F29F3D;
        }

        .green {
            background-color: #92B418;
        }

        main {
            flex: 1;
        }

        #pattern {
            padding: 0;
            margin: 0;
            border: 0;
        }

        footer {
            background: white;
            flex-shrink: 0;
        }

        #logoFooter {
            padding: 0;
            margin: 0 auto;
            border: 0;
            display: block;
            padding: 20px;
        }

        .hero {
            width: auto;
            margin: 0 auto;
            padding: 10% 10%;
            text-align: center;
            color: white;
        }

        .black {
            color: black;
        }

        .hero h1 {
            font-size: 60px;
        }

        .hero p {
            font-size: 18px;
        }

        .image-container {
            width: 100%;
        }

        .image-container img {
            display: block;
            width: 100%;
            max-width: 800px;
            height: auto;
            margin: 0 auto;
        }

        .didas-section {
            height: 55px;
            padding: 0 20%;
        }

        .didas-section p {
            color: white;
            text-align: center;
            font-size: 11px;
            line-height: 12px;
            font-weight: 400;
        }

        .arrow {
            font-size: 1.2em;
            line-height: 1;
            font-weight: 400;
        }

        .timeline {
            width: min(90%, 760px);
            margin: 0 auto;
            padding: 8vh 0;
        }

        .timeline-link {
            display: grid;
            grid-template-columns: 3rem 1fr auto;
            align-items: center;
            gap: 1.25rem;
            padding: 1.1rem 0;
            color: black;
            text-decoration: none;
            border-bottom: 1px solid rgba(0, 0, 0, 0.25);
            font-size: clamp(1.4rem, 4vw, 2.5rem);
        }

        .timeline-link:first-child {
            border-top: 1px solid rgba(0, 0, 0, 0.25);
        }

        .timeline-link:hover,
        .timeline-link:focus-visible {
            color: #92B418;
        }

        .timeline-year {
            font-size: 0.65em;
            font-weight: 400;
        }

        @media (max-width: 480px) {
            .timeline {
                width: 84%;
                padding: 5vh 0;
            }

            .timeline-link {
                grid-template-columns: 2.2rem 1fr auto;
                gap: 0.75rem;
                font-size: 1.35rem;
            }
        }
    </style>
</head>
